<style>
/* Layout: a vertical snap feed, one grammar question per screen; options sit in the thumb zone, the rule appears between prompt and options. */
:root{
  --bg:#ECEEE9; --card:#F8F9F6; --ink:#171B19; --muted:#5A635D; --line:#D2D8D0;
  --reclam:#F2C230; --reclam-ink:#2A2206;
  --der:#2D58A6; --die:#B03548; --das:#2C7A57;
  --ok:#2C7A57; --ok-bg:#DDEEE4; --bad:#B03548; --bad-bg:#F6DEE2; --mark:#F6E2A0;
  --f-ui:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-text:"Newsreader",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111413; --card:#1A1E1C; --ink:#E6E9E3; --muted:#909A93; --line:#2B312E;
  --reclam:#E7B82A; --reclam-ink:#1A1503;
  --der:#8BABEC; --die:#EC8D9D; --das:#76C8A0;
  --ok:#76C8A0; --ok-bg:#16301F; --bad:#EC8D9D; --bad-bg:#3A1C22; --mark:#54451A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111413; --card:#1A1E1C; --ink:#E6E9E3; --muted:#909A93; --line:#2B312E;
  --reclam:#E7B82A; --reclam-ink:#1A1503;
  --der:#8BABEC; --die:#EC8D9D; --das:#76C8A0;
  --ok:#76C8A0; --ok-bg:#16301F; --bad:#EC8D9D; --bad-bg:#3A1C22; --mark:#54451A;
  color-scheme:dark}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}

header{padding-block:10px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:10px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.025em}
.brand i{width:11px;height:20px;background:var(--reclam);border-radius:1.5px;box-shadow:inset -3px 0 0 rgba(0,0,0,.12)}
.weak-btn{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 13px;font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:7px}
.weak-btn b{background:var(--bad);color:var(--card);font-size:11px;min-width:18px;height:18px;border-radius:9px;display:inline-grid;place-items:center;padding:0 5px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.focus-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--reclam);color:var(--reclam-ink);border-radius:8px;padding:7px 8px 7px 12px;font-size:13px;font-weight:600}
.focus-bar button{border:0;background:rgba(0,0,0,.1);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;color:inherit}

html,body{overscroll-behavior:none}
.feed{overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;overflow-anchor:none;min-height:0}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;justify-content:center;padding-block:18px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.card-in{width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;min-height:0;scrollbar-width:thin}
.meta{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.again{color:var(--reclam-ink);background:var(--reclam);padding:3px 8px;border-radius:3px;letter-spacing:.1em}
.prompt{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:110px}
.task{font-weight:600;font-size:13px;color:var(--muted)}
.noun{font-weight:800;font-size:clamp(46px,14vw,76px);line-height:1;letter-spacing:-.035em;overflow-wrap:anywhere}
.noun.sm{font-size:clamp(38px,11vw,60px)}
.gloss{font-family:var(--f-text);font-style:italic;font-size:19px;color:var(--muted)}
.sentence{font-family:var(--f-text);font-size:clamp(25px,6.8vw,33px);line-height:1.3;text-wrap:balance}
.gap{font-family:var(--f-ui);font-weight:600;font-size:.88em;border-bottom:2px solid var(--ink);padding:0 2px;white-space:nowrap}
.gap .blank{color:var(--muted);font-weight:400}
mark{background:var(--mark);color:inherit;padding:0 4px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}

.opts{display:grid;gap:8px;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}
.opt{min-height:56px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font-weight:600;font-size:18px;padding:8px 10px;cursor:pointer;transition:background .15s,border-color .15s,opacity .2s,transform .1s;overflow-wrap:anywhere}
.opt:active{transform:scale(.98)}
.opt:focus-visible,.chip:focus-visible,.weak-btn:focus-visible,.next:focus-visible,.srow:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.opt.span{grid-column:1/-1}
.opt.g{font-size:26px;min-height:72px;color:var(--gc);letter-spacing:-.01em}
.opt:disabled{cursor:default}
.answered .opt:not(.right):not(.wrong){opacity:.45}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.g.right{background:var(--gc);border-color:var(--gc);color:var(--card)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.opt.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:16px}
.opt.quiet{background:transparent;font-size:15px}

.fb{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px;animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.verdict{font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.ans{font-family:var(--f-text);font-weight:500;font-size:21px;line-height:1.3}
.why{font-family:var(--f-text);font-size:16.5px;line-height:1.5;max-width:62ch}
.fb-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:2px}
.rule-tag{font-weight:600;font-size:12px;color:var(--muted)}
.next{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer}
.art-m{color:var(--der)} .art-f{color:var(--die)} .art-n{color:var(--das)}

.info .prompt{justify-content:center}
.big-h{font-weight:800;font-size:clamp(34px,10vw,52px);line-height:1.02;letter-spacing:-.03em;text-wrap:balance;margin:0}
.ins-stat{font-weight:600;font-size:14px;color:var(--bad);margin:0}
.lede{font-family:var(--f-text);font-size:19px;line-height:1.45;margin:0;max-width:40ch}
.misslist{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.misslist li{font-family:var(--f-text);font-size:17px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.hint{font-weight:600;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.hint svg{width:16px;height:16px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.legend{display:flex;gap:14px;font-weight:800;font-size:22px}
.metabtns{display:flex;gap:6px;align-items:center}
.keybtn{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:3px 10px;font:600 11px var(--f-ui);letter-spacing:.04em;text-transform:none;color:var(--ink);cursor:pointer}
.opt small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-top:2px;letter-spacing:0}
.opt.right small,.opt.wrong small{color:inherit;opacity:.85}
.opt.case{text-align:left;padding:10px 14px;font-size:17px}
.hintbtn{align-self:flex-start;border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:5px 12px;font:600 13px var(--f-ui);color:var(--muted);cursor:pointer}
.hintline,.stepnote{font-family:var(--f-text);font-size:17px;line-height:1.45;margin:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.stepnote.ok{border-color:var(--ok)} .stepnote.bad{border-color:var(--bad)}
.chain{margin:0;padding-left:1.3em;font-family:var(--f-text);font-size:16.5px;line-height:1.5;display:flex;flex-direction:column;gap:4px}
.chain.find{font-size:16px}
.jobs{display:flex;flex-direction:column;gap:8px}
.job{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.job b{font-weight:800;font-size:16px}
.job i{font-style:normal;font-size:12.5px;font-weight:600;color:var(--muted)}
.job span{font-family:var(--f-text);font-size:17px;margin-top:3px}
.job u{text-decoration:none;background:var(--mark);padding:0 3px;border-radius:3px}
.hooks{margin:0;padding-left:1.2em;font-family:var(--f-text);font-size:16.5px;line-height:1.5;display:flex;flex-direction:column;gap:6px}
table.ref th small{display:block;font:500 10.5px var(--f-ui);color:var(--muted);letter-spacing:0}
.skipwarm{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font:600 11px var(--f-ui);letter-spacing:.06em;text-transform:none;color:var(--muted);cursor:pointer}
.verdict.curve{color:var(--reclam-ink);background:var(--reclam);align-self:flex-start;padding:3px 8px;border-radius:3px}
.tablewrap{overflow-x:auto}
table.ref{border-collapse:collapse;font-size:15px;width:100%;font-variant-numeric:tabular-nums}
table.ref th,table.ref td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-weight:500}
table.ref thead th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.ref tbody th{font-weight:700}
table.ref td{font-family:var(--f-text);font-size:17px}
.ref3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ref3>div{display:flex;flex-direction:column;gap:6px;padding:12px 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:13px;line-height:1.35}
.ref3 b{font-size:24px;font-weight:800}
.newtag{color:var(--card);background:var(--ink);padding:3px 8px;border-radius:3px;letter-spacing:.1em}
.preview{font-family:var(--f-text);font-size:19px;line-height:1.6;margin:0}
.sets{display:flex;flex-direction:column;gap:14px}
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.set-name{font-weight:600;font-size:15px}
.set-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.set-bar{grid-column:1/-1;position:relative;height:8px;background:var(--line);border-radius:4px;overflow:visible}
.set-bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.set-bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);left:60%}
.set-note{grid-column:1/-1;font-size:13px;color:var(--muted);margin:0}
.set .add{grid-column:1/-1;justify-self:start;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:rise .2s ease-out}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.sheet-top{display:flex;justify-content:space-between;align-items:center}
.sheet h2{font-weight:800;font-size:28px;letter-spacing:-.025em;margin:0}
.close{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer}
.summary{font-family:var(--f-text);font-size:18px;line-height:1.45;margin:0}
.grp-h{font-weight:600;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.srows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name state" "bar count";gap:6px 12px;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.sname{grid-area:name;font-weight:600;font-size:15px}
.sstate{grid-area:state;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;align-self:center}
.st-bad{background:var(--bad-bg);color:var(--bad)} .st-mid{background:var(--reclam);color:var(--reclam-ink)} .st-ok{background:var(--ok-bg);color:var(--ok)} .st-none{color:var(--muted)}
.bar{grid-area:bar;height:6px;background:var(--line);border-radius:3px;overflow:hidden;align-self:center}
.bar i{display:block;height:100%;border-radius:3px;background:var(--muted)}
.bar i.st-bad{background:var(--bad)} .bar i.st-mid{background:var(--reclam)} .bar i.st-ok{background:var(--ok)}
.scount{grid-area:count;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.reset{align-self:flex-start;border:1.5px solid var(--line);background:transparent;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.reset.armed{border-color:var(--bad);color:var(--bad)}
.note{font-size:13px;color:var(--muted);margin:0;line-height:1.45}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

<script>
/* ---------- Rules ---------- */
const SKILLS={
 fem_suffix:{g:"Genus",name:"Feminine endings",rule:"Nouns ending in -ung, -heit, -keit, -schaft, -ion, -tät, -ik, -ur, -ei, -enz and -anz are feminine. Check the ending before anything else: this is the most reliable pattern in German."},
 dim:{g:"Genus",name:"Diminutives",rule:"-chen and -lein make a thing small, and every diminutive is das, whatever the original gender: der Hund becomes das Hündchen. That is why it is das Mädchen."},
 neut_suffix:{g:"Genus",name:"Neuter endings",rule:"-ment, -um, -nis, -tum, -ma and the prefix Ge- point to das: das Dokument, das Museum, das Ergebnis, das Eigentum, das Klima, das Gespräch. Ge- even beats the -e rule: das Gebäude, das Gemüse. Watch for die Firma and die Erlaubnis."},
 masc_suffix:{g:"Genus",name:"Masculine endings",rule:"-ling, -ismus, -or, -ig, -ist, -ent, -ant and -eur point to der: der Lehrling, der Tourismus, der Motor, der König, der Journalist, der Präsident. Most nouns in -er are der too, especially people and machines (der Lehrer, der Computer), though das Fenster and die Butter are exceptions."},
 e_fem:{g:"Genus",name:"Nouns ending in -e",rule:"Around 90% of nouns ending in -e are feminine: die Lampe, die Straße, die Sprache. Bet on die unless the noun is a male person or animal."},
 e_exception:{g:"Genus",name:"The -e exceptions",rule:"Most -e exceptions are male people and animals: der Junge, der Kunde, der Löwe, der Affe. Then a short list to memorise: der Name, der Gedanke, der Glaube, der Käse, das Auge, das Ende."},
 masc_semantic:{g:"Genus",name:"Days, seasons, weather",rule:"Days, months, seasons, weather and compass points are der: der Montag, der Januar, der Herbst, der Regen, der Norden."},
 neut_misc:{g:"Genus",name:"Metals, colours, loanwords",rule:"Most metals are das (das Gold, das Metall), and colours used as nouns are das (das Blau, das Grün). Loanwords ending in -o are das too: das Kino, das Auto, das Büro."},
 nominal_inf:{g:"Genus",name:"Verbs used as nouns",rule:"Any infinitive can become a noun, and it is always das: das Leben, das Essen, das Wissen, das Vertrauen. If a noun looks exactly like a verb, bet on das."},
 compound:{g:"Genus",name:"Compound nouns",rule:"A compound takes the gender of its last part. das Haus + die Tür = die Haustür. die Kranken + das Haus = das Krankenhaus."},
 arbitrary:{g:"Genus",name:"No-rule nouns",rule:"No dependable pattern here. Learn the article as part of the word: not \"Tisch, masculine\" but \"der Tisch\", said aloud as one unit."},
 case_acc_prep:{g:"Kasus",name:"Accusative prepositions",rule:"durch, für, gegen, ohne and um always take the accusative. Only the masculine visibly changes: ein becomes einen, mein becomes meinen."},
 case_dat_prep:{g:"Kasus",name:"Dative prepositions",rule:"aus, bei, mit, nach, seit, von, zu and gegenüber always take the dative: -em for masculine and neuter, -er for feminine, -en for plural."},
 case_twoway:{g:"Kasus",name:"Two-way prepositions",rule:"in, an, auf, über, unter, vor, hinter, neben, zwischen. Destination/change of location (wohin?) takes accusative; location (wo?) takes dative. Movement by itself does not decide. Compare legen/stellen/setzen (put) with liegen/stehen/sitzen (be)."},
 case_gen_prep:{g:"Kasus",name:"Genitive",rule:"wegen, trotz, während and statt take the genitive even without ownership; possession also often uses genitive (das Auto meiner Schwester). Masculine and neuter nouns also add -s or -es: des Regens, eines Briefes."},
 case_verb:{g:"Kasus",name:"Subjects and objects",rule:"The subject is nominative. The direct object is accusative (ich sehe meinen Vater). The indirect object (person given something) is dative (ich gebe meiner Schwester …). Some verbs always take the dative: helfen, danken, gehören, gefallen."},
 case_id:{g:"Kasus",name:"Spotting the case",rule:"First check a preposition or a verb requiring a fixed case. Otherwise ask: wer? (nominative), wen or was? (accusative), wem? (dative), wessen? (genitive). Prepositions and certain verbs override the question, so check those first."},
 adj_weak:{g:"Adjektive",name:"After der/die/das",rule:"After der, die, das, dieser, jeder, the article already shows gender and case, so the adjective only needs -e or -en. It is -e in the nominative singular and in feminine and neuter accusative. Everywhere else, -en."},
 adj_mixed:{g:"Adjektive",name:"After ein/mein/kein",rule:"ein, mein and kein have no ending in the masculine nominative and the neuter nominative and accusative. In those three slots the adjective shows the gender instead: ein alter Mann, ein kaltes Bier. Everywhere else it works like after der."},
 adj_strong:{g:"Adjektive",name:"No article",rule:"With no article, the adjective takes the article's own ending: kaltes Wasser (das), schwarzen Kaffee (den), bei schlechtem Wetter (dem), mit großer Freude (der). The one exception is masculine and neuter genitive, which use -en: trotz schlechten Wetters."},
 aux_sein:{g:"Verben",name:"Perfekt with sein",rule:"sein is for movement from A to B (gehen, fahren, fliegen) and changes of state (einschlafen, sterben, wachsen). sein, bleiben, werden and passieren take sein too, with no movement at all."},
 aux_haben:{g:"Verben",name:"Perfekt with haben",rule:"Everything else takes haben, including every verb with a direct object and the position verbs liegen, sitzen, stehen. (Southern Germany and Austria say \"ich bin gelegen\", but haben is standard.)"},
 part_strong:{g:"Verben",name:"Strong participles",rule:"Strong verbs: ge- + stem, often with a new vowel, + -en. The vowels run in families, so learn them in groups: trinken/getrunken, finden/gefunden, schreiben/geschrieben, bleiben/geblieben."},
 part_weak:{g:"Verben",name:"Regular participles",rule:"Regular verbs: ge- + stem + -t. Stems ending in -t or -d add -et: gearbeitet. If you can say the Präteritum with -te (machte), the participle is ge…t (gemacht)."},
 part_mixed:{g:"Verben",name:"Mixed verbs",rule:"A small group changes the vowel like a strong verb but ends in -t like a regular one: denken/gedacht, bringen/gebracht, wissen/gewusst, kennen/gekannt, rennen/gerannt."},
 part_insep:{g:"Verben",name:"Participles without ge-",rule:"No ge- after an inseparable prefix (be-, ver-, ent-, er-, ge-, zer-, emp-, miss-) and none on -ieren verbs: verstanden, besucht, bekommen, studiert, passiert."},
 part_sep:{g:"Verben",name:"Separable verbs",rule:"With a separable prefix (an, auf, aus, ein, mit, um, zu …), ge- goes between prefix and stem: an·ge·rufen, auf·ge·standen, ein·ge·kauft."},
 praet:{g:"Verben",name:"Präteritum forms",rule:"Strong verbs change the vowel and take no ending in the er/sie/es form: er ging, sie las, es kam. Mixed verbs change the vowel and add -te: dachte, brachte, wusste. Separable prefixes go to the end: er stand früh auf."},
 tense_id:{g:"Verben",name:"Naming the tense",rule:"Find the conjugated verb. Present haben/sein + participle = Perfekt. hatte/war + participle = Plusquamperfekt. werden + infinitive = Futur I. werden on its own is a full verb (become), and werden + participle is the passive."},

["Wir fuhren nach Italien.","Präteritum","fuhren is the Präteritum of fahren: the vowel changes from a to u."],
["Sie wird morgen anrufen.","Futur I","wird + the infinitive anrufen."],
["Er hatte schon gegessen.","Plusquamperfekt","hatte is past tense, plus the participle gegessen."],
["Ich lerne seit zwei Jahren Deutsch.","Präsens","German uses the Präsens with seit for something still going on. English would say \"have been learning\"."],
["Sie war schon gegangen, als ich kam.","Plusquamperfekt","war + gegangen: her leaving happened before my arriving."],
["Wir sind nach Hause gelaufen.","Perfekt","sind is present tense, so sind + participle is the Perfekt, even though it looks like \"we are\"."],
["Er wird langsam müde.","Präsens","werden is the main verb here, meaning \"become\". There is no infinitive, so it is not the future."],
["Das Haus wurde 1910 gebaut.","Präteritum","wurde + participle is the passive, set in the Präteritum: \"was built\"."],
["Ich war gestern krank.","Präteritum","war on its own is the Präteritum of sein."],
["Ich bin krank gewesen.","Perfekt","bin + gewesen is the Perfekt of sein."],
["Morgen fahre ich nach Hamburg.","Präsens","A present form with a time word. German usually uses the Präsens for plans."],
["Du wirst das schaffen.","Futur I","wirst + the infinitive schaffen."],
["Sie hatten keine Zeit.","Präteritum","hatten is the main verb here, with no participle, so it is simply \"had\"."],
["Wir hatten das schon gewusst.","Plusquamperfekt","hatten + the participle gewusst."],
["Er ist gestern angekommen.","Perfekt","ist + the participle angekommen."],
["Ich dachte oft an dich.","Präteritum","dachte is the Präteritum of the mixed verb denken."],
["Ihr werdet das bald verstehen.","Futur I","werdet + the infinitive verstehen."]

  const unseen=pool.filter(i=>i.pack&&!state.items[i.key]&&!pend.has(i.key)).sort((a,b)=>a.pack-b.pack||a.ord-b.ord);
  if(unseen.length&&Math.random()<0.4){res={item:unseen[0],again:false,isNew:true}}
  else{
  const skills=[...new Set(pool.map(i=>i.skill))];
  const skill=wpick(skills,id=>{const s=state.skills[id];if(!s||s.n<3)return 1;return (1-mastery(id))*1.8+0.12});
  let items=pool.filter(i=>i.skill===skill&&!pend.has(i.key));
  const fresh=items.filter(i=>{const r=state.items[i.key];return !r||r.last==null||r.last<state.answered-10});
  if(fresh.length) items=fresh;
  if(!items.length) items=pool.filter(i=>!pend.has(i.key));
  const it=wpick(items,i=>{const r=state.items[i.key];return 1/(1+(r?r.box:0))});
  res={item:it,again:false,isNew:!!(it.pack&&!state.items[it.key])};
  }
 }
 if(state.focus){state.focus.left--;if(state.focus.left<=0)state.focus=null;save();updateFocusBar()}
 return res;
}

function build(item){
 const v=item.v;
 switch(item.type){
 case "gender":{
  const opts=["m","f","n"].map(g=>({label:ART[g],cls:"g",style:`--gc:var(--${ART[g]})`}));
  const ans=ART[item.g];
  return {cols:3,task:"Which article?",prompt:`<div class="noun">${item.word}</div><div class="gloss">${item.en}</div>`,options:opts,correct:["m","f","n"].indexOf(item.g),
   explain:`<p class="ans"><b class="art-${item.g}">${ans}</b> ${item.word}</p><p class="why">${item.part?`Last part: <b>${item.part}</b>. `:""}${SKILLS[item.skill].rule}</p>`,summary:`${ans} ${item.word}`};
 }
 case "case":{
  const m=item.s.match(/\{(\w+)\}/);const stem=m[1];
  const forms=["","e","en","em","er","es"].map(e=>stem+e);const ans=stem+EIN[item.g][item.c];
  const full=item.s.replace(m[0],ans);
  return {cols:3,task:"Fill the gap",prompt:`<div class="sentence">${item.s.replace(m[0],`<span class="gap">${stem}<span class="blank">___</span></span>`)}</div>`,
   options:forms.map(f=>({label:f})),correct:forms.indexOf(ans),
   explain:`<p class="ans">${item.s.replace(m[0],"<b>"+ans+"</b>")}</p>${caseChain(item)}`,summary:full};
 }
 case "adj":{
  const m=item.s.match(/([A-Za-zÄÖÜäöüß]+)\{\}/);const stem=m[1];
  const ends=["e","en","er","es","em"];const forms=ends.map(e=>stem+e);
  const ans=stem+ADJT[item.k][item.g][item.c];
  return {cols:3,task:"Choose the adjective ending",prompt:`<div class="sentence">${item.s.replace(m[0],`<span class="gap">${stem}<span class="blank">__</span></span>`)}</div>`,
   options:forms.map(f=>({label:f})),correct:forms.indexOf(ans),
   explain:`<p class="ans">${item.s.replace(m[0],"<b>"+ans+"</b>")}</p><p class="why">${ADJKIND[item.k]}, ${GENW[item.g]}, ${caseTag(item.c)}: <b>-${ADJT[item.k][item.g][item.c]}</b>. ${SKILLS[item.skill].rule}</p>`,summary:item.s.replace(m[0],ans)};
 }
 case "aux":{
  const o=v.pr==="ich"?["habe","bin"]:v.pr==="wir"?["haben","sind"]:["hat","ist"];const ci=v.aux==="sein"?1:0;
  const why=v.note||(v.aux==="sein"?"Movement from A to B, so sein.":"No movement to a new place and no change of state, so haben.");
  return {cols:2,task:"haben or sein?",prompt:`<div class="sentence">${v.s.replace("{}",'<span class="gap"><span class="blank">_____</span></span>')}</div>`,options:o.map(l=>({label:l})),correct:ci,
   explain:`<p class="ans">${v.s.replace("{}","<b>"+o[ci]+"</b>")}</p><p class="why">${why}</p>`,summary:v.s.replace("{}",o[ci])};
 }
 case "part":{
  const o=shuffle([v.pp,...v.dp]);const a=(v.aux==="sein"?"ist ":"hat ");
  return {cols:1,task:"Partizip II",prompt:`<div class="noun sm">${v.i}</div><div class="gloss">${v.en}</div>`,options:o.map(l=>({label:l})),correct:o.indexOf(v.pp),
   explain:`<p class="ans">${v.i} → ${a}<b>${v.pp}</b></p><p class="why">${PTEXT[v.t]}${v.t==="sep"||v.t==="insep"?"":""}</p>`,summary:`${v.i} → ${a}${v.pp}`};
 }
 case "praet":{
  const o=shuffle([v.p3,...v.dr]);
  const why=v.t==="mixed"?"Mixed verb: new vowel plus -te.":v.t==="sep"?"The stem changes like the base verb, and the prefix moves to the end.":"Strong verb: new vowel, no ending in the er/sie/es form.";
  return {cols:1,task:"Präteritum, er/sie/es",prompt:`<div class="noun sm">${v.i}</div><div class="gloss">${v.en}</div>`,options:o.map(l=>({label:"er "+l})),correct:o.indexOf(v.p3),
   explain:`<p class="ans">${v.i} → er <b>${v.p3}</b></p><p class="why">${why} Perfekt: ${v.aux==="sein"?"ist":"hat"} ${v.pp}.</p>`,summary:`${v.i} → er ${v.p3}`};
 }
 case "tense":
  return {cols:2,task:"Which tense?",prompt:`<div class="sentence">${item.s}</div>`,options:TENSES.map((t,i)=>({label:t,cls:i===4?"span":""})),correct:TENSES.indexOf(item.a),
   explain:`<p class="ans">${item.a}</p><p class="why">${item.why}</p>`,summary:`${item.s} (${item.a})`};

   explain:`<p class="ans">${phrase}: ${caseTag(item.a)}</p><p class="why">${item.why}</p>`,summary:`${item.s.replace(/\[\[|\]\]/g,"")} → ${phrase}: ${CASEDE[item.a]}`};
 }}
}

function append(entry){deck.push(entry);feed.appendChild(entry.el)}
function ensureAhead(){if(scrolling)return;while(deck.length-1-cur<3)append(nextEntry())}
function nextEntry(){
 if(genusRulesActive)return genusRuleEntry();

 if(!state.focus&&state.answered-lastInsight>=12){lastInsight=state.answered;const ins=insightEntry();if(ins)return ins}

/* Native snap scrolling (the original feel), with two guards:
   1. New cards are only appended once scrolling has stopped. Changing the feed mid-swipe makes
      Chrome re-snap to a stale target, which showed up as a jump back several cards.
   2. When scrolling settles off a card boundary, glide to the nearest card. */
const cardH=()=>feed.clientHeight||1;
let settleT=null,scrolling=false;
function settle(){
 scrolling=false;
 const h=cardH(),pos=feed.scrollTop,i=Math.max(0,Math.min(deck.length-1,Math.round(pos/h)));
 cur=i;
 const target=deck[i]?deck[i].el.offsetTop:i*h;
 if(Math.abs(pos-target)>2){feed.scrollTo({top:target,behavior:reduced?"auto":"smooth"});return}
 ensureAhead();
}
feed.addEventListener("scroll",()=>{scrolling=true;clearTimeout(settleT);settleT=setTimeout(settle,140)},{passive:true});
if("onscrollend" in feed)feed.addEventListener("scrollend",()=>{clearTimeout(settleT);settleT=setTimeout(settle,30)});
function goTo(i){
 if(i<0)i=0;
 while(i>=deck.length)append(nextEntry());
 if(!deck[i])return;
 cur=i;
 feed.scrollTo({top:deck[i].el.offsetTop,behavior:reduced?"auto":"smooth"});
}
addEventListener("resize",()=>{clearTimeout(settleT);if(deck[cur])feed.scrollTop=deck[cur].el.offsetTop});
function nextFrom(entry){const i=deck.indexOf(entry);ensureAhead();goTo(i+1)}

function pickWarmTheme(area){
 // Start with the theme the user is weakest on, then rotate.
 const th=themesFor(area);
 if(area==="Kasus"&&["case_id","case_verb"].some(s=>(mastery(s)??0)<0.8))return 0;
 if(area!=="Genus"){
  let best=0,bm=2;th.forEach((t,i)=>{const m=Math.min(...t.main.map(s=>mastery(s)??0.5));if(m<bm){bm=m;best=i}});return best;
 }

function warmItems(area,t){
 const open=ITEMS.filter(unlocked);
 let main,curve;
 if(area==="Genus"){
  const g=open.filter(i=>i.type==="gender");
  if(t.skill){main=g.filter(i=>i.skill===t.skill);curve=g.filter(i=>(t.curveWords||[]).includes(i.word))}
  else{const m=g.filter(i=>t.re.test(i.word));main=m.filter(i=>i.g===t.g);curve=m.filter(i=>i.g!==t.g)}
  // favour shorter, earlier (more common) words for the main examples
  main=main.sort((a,b)=>(a.pack||0)-(b.pack||0)||Math.random()-.5);
 }else{
  main=open.filter(i=>t.main.includes(i.skill));
  curve=t.noteCurve?main.filter(i=>i.v&&i.v.note):open.filter(i=>t.curve.includes(i.skill));
  if(t.noteCurve)main=main.filter(i=>!(i.v&&i.v.note));
 }
 const take=(arr,n)=>shuffle(arr.slice(0,Math.max(n*4,12))).slice(0,n);
 const m=take(main,6),c=take(curve,2);
 const qs=m.slice(0,6-c.length).map(i=>({item:i,curve:false}));
 const examples=m.slice(6-c.length).concat(take(main.filter(i=>!m.includes(i)),3)).slice(0,3);
 // curveballs land at positions 3 and 6, never first
 c.forEach((i,k)=>qs.splice(k===0?2:qs.length,0,{item:i,curve:true}));
 return {qs,examples};
}

const JOBS_HTML=`<div class="jobs">
 <div class="job"><b>Nominativ</b><i>subject · wer? was?</i><span><u>Der Hund</u> schläft. (The dog sleeps.)</span></div>
 <div class="job"><b>Akkusativ</b><i>direct object · wen? was?</i><span>Ich sehe <u>den Hund</u>. (I see the dog.)</span></div>
 <div class="job"><b>Dativ</b><i>indirect object, or required by verb/preposition · wem?</i><span>Ich gebe <u>dem Hund</u> einen Knochen. (I give the dog a bone.)</span></div>
 <div class="job"><b>Genitiv</b><i>relationship/possession, or required by preposition · wessen?</i><span>der Ball <u>des Hundes</u>; trotz <u>des Regens</u></span></div>
 </div><p class="why"><b>Compare:</b> Er gibt seiner Freundin einen Ring. <b>Er</b> = subject (Nom); <b>einen Ring</b> = what he gives (Akk); <b>seiner Freundin</b> = who he gives it to (Dat). Not every dative receives something: <b>helfen</b> requires dative. <b>Trotz</b> requires genitive even when nobody owns anything.</p>`;
const HOOKS_HTML=`<ul class="hooks">
  <li><b>Akkusativ:</b> only der changes, to <b>den</b>. die, das and plural stay the same.</li>
  <li><b>Dativ</b> is the <b>-m</b> case: dem, einem, meinem (like English him). Feminine goes to der, plural to den.</li>
  <li><b>mein, ein, kein</b> copy the article's ending: dem → mein<b>em</b>, den → mein<b>en</b>, der → mein<b>er</b>. No ending where the article is der (Nominativ) or das: mein Mann, mein Kind.</li>
 </ul>`;
const TABLE_HTML=`<div class="tablewrap"><table class="ref"><thead><tr><th></th><th class="art-m">masc.</th><th class="art-f">fem.</th><th class="art-n">neut.</th><th>plural</th></tr></thead><tbody>

  <tr><th>Akk<small>direct object</small></th><td><b>den</b></td><td>die</td><td>das</td><td>die</td></tr>
  <tr><th>Dat<small>indirect / fixed</small></th><td><b>dem</b></td><td><b>der</b></td><td><b>dem</b></td><td><b>den</b> +n</td></tr>

const FIND_HTML=`<ol class="chain find">
 <li><b>1. Check prepositions first.</b> mit, bei, von, zu → Dat; für, durch, ohne → Akk; trotz, wegen, während → Gen.</li>
 <li><b>2. Check verbs with fixed cases.</b> helfen, danken, gefallen, gehören → Dat. Don't guess from who is affected.</li>
 <li><b>3. Otherwise identify the role.</b> Subject → Nom; direct object (what is given/seen?) → Akk; indirect object (to whom?) → Dat; possession/relationship → often Gen.</li>
 <li><b>4. With two-way prepositions</b> in, auf, an etc., destination (wohin?) → Akk; location (wo?) → Dat. Movement alone is NOT the rule.</li>

function simplify(q,item){
 const n=q.options.length;if(n<=3)return q;
 const labels=q.options.map(o=>o.label);const right=labels[q.correct];
 let pref=[];
 if(item.type==="case"){const stem=item.s.match(/\{(\w+)\}/)[1];const other={A:"D",D:"A",N:"A",G:"D"}[item.c];pref=[stem+EIN[item.g][other]]}
 else if(item.type==="adj"){pref=labels.filter(l=>/e$|en$/.test(l))}
 else if(item.type==="tense"){pref=[{"Perfekt":"Präteritum","Präteritum":"Perfekt","Plusquamperfekt":"Perfekt","Futur I":"Präsens","Präsens":"Futur I"}[right]]}
 else if(item.type==="caseid"){pref=[caseBtn({N:"A",A:"D",D:"A",G:"D"}[item.a])]}
 const wrong=[...new Set(pref.filter(l=>l&&l!==right&&labels.includes(l)).concat(shuffle(labels.filter(l=>l!==right))))].slice(0,2);
 const keep=q.options.filter(o=>o.label===right||wrong.includes(o.label)).map(o=>({...o,cls:(o.cls||"").replace("span","")}));
 const long=keep.some(o=>strip(o.label).length>11);
 return {...q,options:keep,correct:keep.findIndex(o=>o.label===right),cols:long?1:3};
}

 const rb=$("#resetBtn");let armed=false,t;
 rb.addEventListener("click",()=>{
  if(!armed){armed=true;rb.classList.add("armed");rb.textContent="Tap again to erase all progress";t=setTimeout(()=>{armed=false;rb.classList.remove("armed");rb.textContent="Reset progress"},4000);return}
  clearTimeout(t);const mode=state.mode;state=fresh();state.mode=mode;state.seen=true;save();lastInsight=0;updateWeakBtn();updateFocusBar();openSheet();
 });
 $("#closeSheet").focus();
}
function setRow(g){
 const a=areaProgress(g);const isG=g==="Genus";
 const base=isG?NOUNS.length:VERBS.length;const total=base+(isG?NOUNS_X.length:VERBS_X.length);
 const have=base+Math.min(isG?NOUNS_X.length:VERBS_X.length,a.packs*PACK_SIZE[g]);
 const unit=isG?"nouns":"verbs";
 const done=a.packs>=a.max;
 const note=done?`All ${total} ${unit} unlocked.`:canUnlock(g)?`Next set ready: the ${isG?PACK_SIZE.Genus:PACK_SIZE.Verben} next most common ${unit}.`:`The next set unlocks when the bar passes the 60% mark.`;
 return `<div class="set"><span class="set-name">${g}: ${have} of ${total} ${unit}</span><span class="set-meta">${Math.round(a.ratio*100)}% known</span>
  <span class="set-bar" role="img" aria-label="${Math.round(a.ratio*100)}% known, 60% needed"><i style="width:${Math.round(a.ratio*100)}%"></i><b></b></span>
  <p class="set-note">${note}</p>${!done&&canUnlock(g)?`<button type="button" class="add" data-add="${g}">Add next set</button>`:""}</div>`;
}
function closeSheet(){sheet.hidden=true}
$("#weakBtn").addEventListener("click",openSheet);

/* ---------- Keyboard ---------- */
document.addEventListener("keydown",e=>{
 if(!sheet.hidden){if(e.key==="Escape")closeSheet();return}
 const d=deck[cur];
 if(/^[1-6]$/.test(e.key)&&d&&d.kind==="q"&&!d.answered){const b=d.el.querySelectorAll(".opt")[+e.key-1];if(b){b.click();e.preventDefault()}}
 else if(e.key==="ArrowDown"||e.key==="j"||(e.key===" "&&e.target===document.body)){e.preventDefault();ensureAhead();goTo(cur+1)}
 else if(e.key==="ArrowUp"||e.key==="k"){e.preventDefault();goTo(cur-1)}
});

/* ---------- Boot ---------- */
updateChips();updateFocusBar();updateWeakBtn();
if(state.mode!=="all")startWarm(state.mode,true);
append(openingEntry());ensureAhead();
</script>

</body></html>
